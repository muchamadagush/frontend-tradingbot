server {
    listen 80;
    
    # Root folder where the build files are located
    root /usr/share/nginx/html;
    index index.html;

    # 1. DO NOT CACHE index.html (This fixes your problem!)
    location /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 2. Cache static assets (CSS, JS, Images) for 1 year (Performance)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. Handle React Router (Refresh page won't 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}